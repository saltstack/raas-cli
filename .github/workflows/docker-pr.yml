name: Docker Pre-Merge Validation

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  docker-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Test Docker Image Build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: false
          tags: salt-cli-api:test
          build-args: |
            PIP_INDEX_URL=https://pypi.org/simple
          cache-from: type=gha,scope=raas-cli-docker
          cache-to: type=gha,mode=max,scope=raas-cli-docker